general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
}

background {
    monitor =
    path = screenshot
    color = rgb(14121c)
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = rgb(eeeaf5)
    font_size = 80
    font_family = Noto Sans
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%d/%m/%Y"
    color = rgb(bbb2cf)
    font_size = 20
    font_family = Noto Sans
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgb(9b87c7)
    inner_color = rgba(1b1725dd)
    font_color = rgb(eeeaf5)
    check_color = rgb(89b482)
    fail_color = rgb(e57878)
    font_family = Noto Sans
    fade_on_empty = false
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    placeholder_text = Enter your password
    fail_text = Authentication failed ($ATTEMPTS)
    position = 0, -25
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER · Gentoo Linux
    color = rgb(bbb2cf)
    font_size = 17
    font_family = Noto Sans
    position = 0, -100
    halign = center
    valign = center
}
