[terminal]
shell = { program = "/usr/bin/tmux", args = ["new-session", "-A", "-s", "main"] }

[window]
padding = { x = 0, y = 0 }
opacity = 1.0

[font]
size = 9.5
normal = { family = "0xProto Nerd Font", style = "Regular" }
bold = { family = "0xProto Nerd Font", style = "Bold" }
italic = { family = "0xProto Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 2000
multiplier = 5

[mouse]
hide_when_typing = true

[colors.primary]
background = "#000000"
foreground = "#F5F5F5"

[colors.selection]
text = "#000000"
background = "#737373"

[colors.normal]
black =   "#000000"
red =     "#F87171"
green =   "#4ADE80"
yellow =  "#FBBF24"
blue =    "#A3A3A3"
magenta = "#C084FC"
cyan =    "#22D3EE"
white =   "#D4D4D4"

[colors.bright]
black =   "#525252"
red =     "#FCA5A5"
green =   "#86EFAC"
yellow =  "#FDE047"
blue =    "#D4D4D4"
magenta = "#D8B4FE"
cyan =    "#67E8F9"
white =   "#FFFFFF"
