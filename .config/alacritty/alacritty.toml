# ~/.config/alacritty/alacritty.toml

[terminal]
# Inicia o tmux automaticamente ao abrir
shell = { program = "/usr/bin/tmux", args = ["new-session", "-A", "-s", "main"] }

[window]
padding = { x = 0, y = 0 }
opacity = 1.0

[font]
size = 9.5
normal = { family = "0xProto Nerd Font", style = "Regular" }
bold = { family = "0xProto Nerd Font", style = "Bold" }
italic = { family = "0xProto Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "On" }
unfocused_hollow = true

[scrolling]
history = 2000
multiplier = 5

[mouse]
hide_when_typing = true

# --- Esquema de Cores Light ---
[colors.primary]
background = "#FFFFFF"
foreground = "#000000"

[colors.selection]
text = "#FFFFFF"
background = "#000000"

[colors.normal]
black =   "#000000"
red =     "#CC0000"
green =   "#008000"
yellow =  "#B36B00"
blue =    "#0066CC"
magenta = "#8B008B"
cyan =    "#008B8B"
white =   "#666666"

[colors.bright]
black =   "#444444"
red =     "#E60000"
green =   "#008000"
yellow =  "#996600"
blue =    "#0055AA"
magenta = "#9900CC"
cyan =    "#008B8B"
white =   "#000000"
